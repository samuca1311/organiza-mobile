<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2924e8">
  <meta name="description" content="Organiza: seus cursos, turmas e horários em um só lugar.">
  <title>Organiza IA | Organiza</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="dados.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="chat">
  <div id="app" class="app">
<header class="topbar">
  <div class="brand-row">
    <div class="brand">
  <span class="brand-space">
    <img class="brand-image" src="assets/logo.png" alt="Organiza" onerror="this.hidden = true">
  </span>
</div>
    <a class="icon-button" href="avisos.html" aria-label="Ver notificações"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="notification-dot" data-notification hidden></span></a>
  </div>
  <h1 id="page-title">Organiza IA</h1>
  <p class="subtitle">Assistente local de horários.</p>
</header>
<main class="content chat-content">

<p class="chat-tag">Comandos locais • sem conexão com IA externa</p>
<div id="chat-intro">
  <div class="bubble assistant">Olá, <span id="chat-name"></span>! Posso trocar a sala das aulas de uma turma ou conferir os conflitos. Experimente um dos comandos abaixo.</div>
  <div class="examples">
    <button class="example" data-example="Trocar a sala da turma 62-2 para C306">Trocar a sala da turma 62-2 para C306 →</button>
    <button class="example" data-example="Verificar conflitos">Verificar conflitos →</button>
  </div>
</div>
<div id="messages"></div>
<form id="chat-form" class="chat-form">
  <input name="message" aria-label="Mensagem para o assistente" placeholder="O que deseja alterar?" maxlength="500" required autocomplete="off">
  <button class="primary" aria-label="Enviar mensagem" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
</form>

</main>
<nav class="bottom-nav" aria-label="Navegação principal">
  <a class="nav-item" href="inicio.html" ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-7v-8h-4v8H3Z"/></svg><span>Início</span></a>
  <a class="nav-item" href="cursos.html" data-manager-only><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></svg><span>Cursos</span></a>
  <a class="nav-item" href="horarios.html" ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2M7 14h3m4 0h3m-10 4h3"/></svg><span>Horários</span></a>
  <a class="nav-item" href="avisos.html" data-reader-only><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></svg><span>Avisos</span></a>
  <a class="nav-item" href="ajustes.html" ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 3 2 2 1 2 4-2 2v3l1 2-3 3-3-1-3 2-2-1-3-2-2 1-2-3 1-3-1-3 2-3Z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg><span>Ajustes</span></a>
</nav>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-button" data-action="close" aria-label="Fechar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <div id="modal-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
<template id="bubble-template">
  <div class="bubble"><span data-message></span>
    <button class="primary full" data-apply hidden>Confirmar alteração</button>
    <p class="tiny history-date" data-applied hidden>✓ Alteração aplicada</p>
  </div>
</template>

<template id="message-template">
  <p data-message></p>
  <button class="primary full dialog-space" data-action="close">Entendi</button>
</template>
<template id="delete-template">
  <p>Excluir <b data-item-name></b>? <span data-class-warning hidden>As aulas desta turma também serão excluídas. </span>Esta ação não pode ser desfeita.</p>
  <div class="modal-actions">
    <button class="secondary" data-action="close">Cancelar</button>
    <button class="danger" data-confirm-delete>Excluir</button>
  </div>
</template>
<template id="empty-template">
  <div class="empty"><strong data-empty-title></strong><span data-empty-description></span></div>
</template>

</body>
</html>
