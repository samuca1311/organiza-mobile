<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2924e8">
  <meta name="description" content="Organiza: seus cursos, turmas e horários em um só lugar.">
  <title>Organiza IA | Organiza</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css?v=banca-1">
  <script src="dados.js?v=banca-1" defer></script>
  <script src="app.js?v=banca-1" defer></script>
</head>
<body data-page="chat">
  <div id="app" class="app">
<header class="topbar">
  <div class="brand-row">
    <div class="brand">
  <span class="brand-space">
    <img class="brand-image" src="assets/logo.png" width="278" height="119" alt="Organiza" onerror="this.hidden = true">
  </span>
</div>
    <a class="icon-button" href="avisos.html" aria-label="Ver notificações"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="notification-dot" data-notification hidden></span></a>
  </div>
  <h1 id="page-title">Organiza IA</h1>
  <p class="subtitle">Assistente em desenvolvimento.</p>
</header>
<main class="content chat-content">

<p class="chat-tag">Modelo de teste • ainda não configurado</p>
<div id="chat-intro">
  <div class="bubble assistant">Olá, <span id="chat-name"></span>! Este assistente é um modelo de teste e ainda não está configurado.</div>
</div>
<div id="messages"></div>
<form id="chat-form" class="chat-form">
  <input name="message" aria-label="Mensagem para o assistente" placeholder="Digite uma mensagem de teste" maxlength="500" required autocomplete="off">
  <button class="primary" aria-label="Enviar mensagem" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
</form>

</main>
<nav class="bottom-nav" aria-label="Navegação principal">

  <a class="nav-item" href="cursos.html" data-manager-only><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Cadastros</span></a>
  <a class="nav-item" href="horarios.html" ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v4m10-4v4M4 10h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm2 9h2m4 0h2m-8 3h2"/></svg><span>Horários</span></a>
  <a class="nav-item" href="avisos.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 6-3 8-3 9h18c0-1-3-3-3-9m-8 12a2 2 0 0 0 4 0"/></svg><span>Avisos</span></a>
  <a class="nav-item active" href="assistente.html" data-manager-only>
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H9l-5 3v-5a4 4 0 0 1-1-2V8a4 4 0 0 1 4-4Zm1 6h8m-8 4h5"/></svg>
    <span>Assistente</span>
  </a>
  <a class="nav-item" href="ajustes.html" ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16M8 5v4m8 1v4m-6 1v4"/></svg><span>Ajustes</span></a>
</nav>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-button" data-action="close" aria-label="Fechar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <div id="modal-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
<template id="bubble-template">
  <div class="bubble"><span data-message></span>
  </div>
</template>

<template id="message-template">
  <p data-message></p>
  <button class="primary full dialog-space" data-action="close">Entendi</button>
</template>
<template id="delete-template">
  <p>Excluir <b data-item-name></b>? <span data-class-warning hidden>As aulas desta turma também serão excluídas. </span>Esta ação não pode ser desfeita.</p>
  <div class="modal-actions">
    <button class="secondary" data-action="close">Cancelar</button>
    <button class="danger" data-confirm-delete>Excluir</button>
  </div>
</template>
<template id="empty-template">
  <div class="empty"><strong data-empty-title></strong><span data-empty-description></span></div>
</template>

</body>
</html>
