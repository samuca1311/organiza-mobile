<header class="topbar">

    <img class="brand-image" src="assets/logo.png" alt="Organiza" onerror="this.hidden = true">
  </span>
</div>

  </div>
  <h1 id="page-title">Cursos</h1>
  <p class="subtitle">Conheça os cursos cadastrados.</p>
</header>
<main class="content">

<div class="toolbar">
  <div class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0m-2 4 7 7"/></svg><input id="search" type="search" aria-label="Procurar cursos" placeholder="Procurar cursos…"></div>
  <button class="secondary" data-edit="courses">+ Novo Curso</button>
</div>

<div id="entity-list" class="stack"></div>

</main>
<nav class="bottom-nav" aria-label="Navegação principal">

  <a class="nav-item active" href="cursos.html" data-manager-only aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></svg><span>Cursos</span></a>

</nav>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-button" data-action="close" aria-label="Fechar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <div id="modal-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
<template id="entity-template">
  <article class="card entity-card">
    <div class="row">
      <div class="avatar" data-entity-icon></div>
      <div class="grow"><h3 data-name></h3><p class="entity-meta" data-description></p></div>
      <a class="icon-button" data-course-link href="turmas.html" aria-label="Ver turmas"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
    </div>
    <div class="entity-actions" data-manager-only>
  <button class="edit-button" data-edit aria-label="Editar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 3 6 6M3 21l5-1L21 7l-5-5L3 15Z"/></svg></button>
  <button class="edit-button delete" data-delete aria-label="Excluir"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button>
</div>
  </article>
</template><template id="edit-template">
  <form id="edit-form">
    <label>Nome do curso<input name="name" type="text" required maxlength="60"></label><label>Modalidade<input name="type" type="text" required maxlength="60"></label><label>Ícone<select name="icon" required><option value="monitor">Computador</option><option value="flask">Química</option><option value="bolt">Eletricidade</option><option value="settings">Mecânica</option><option value="book">Livro</option></select></label><label>Cor<select name="color" required><option value="purple">Roxo</option><option value="green">Verde</option><option value="brown">Marrom</option><option value="yellow">Amarelo</option><option value="pink">Rosa</option></select></label>
    <p id="edit-error" class="form-error" role="alert"></p>
    <div class="modal-actions">
      <button type="button" class="secondary" data-action="close">Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</template>

<template id="message-template">
  <p data-message></p>
  <button class="primary full dialog-space" data-action="close">Entendi</button>
</template>
<template id="delete-template">
  <p>Excluir <b data-item-name></b>? <span data-class-warning hidden>As aulas desta turma também serão excluídas. </span>Esta ação não pode ser desfeita.</p>
  <div class="modal-actions">
    <button class="secondary" data-action="close">Cancelar</button>
    <button class="danger" data-confirm-delete>Excluir</button>
  </div>
</template>
<template id="empty-template">
  <div class="empty"><strong data-empty-title></strong><span data-empty-description></span></div>
</template>

</body>
</html>
